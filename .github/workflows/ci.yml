name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  repository-boundaries:
    name: Repository Boundary Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify repository boundaries
        run: bash scripts/verify_repository_boundaries.sh

  backend-gates:
    name: Backend Foundation Gates
    runs-on: ubuntu-latest
    needs: repository-boundaries
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('backend/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install backend dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Lint backend
        run: corepack pnpm lint

      - name: Verify backend architecture
        run: corepack pnpm test:architecture

      - name: Run backend unit tests
        run: corepack pnpm test

      - name: Run backend end-to-end tests
        run: corepack pnpm test:e2e

      - name: Build API and worker
        run: corepack pnpm build

  flutter-gates:
    name: Flutter Analysis & Architecture Invariants
    runs-on: ubuntu-latest
    needs: repository-boundaries
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true
          pub-cache: true
          pub-cache-key: 'flutter-pub-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Domain Package Purity (Gate 3)
        run: bash scripts/check_domain_purity.sh

      - name: Static Analysis (Gate 1)
        run: flutter analyze lib/

      - name: Architecture Invariants Test (Gate 2)
        run: flutter test test/architecture_test.dart

      - name: Supabase Migration Layout Contract
        run: flutter test test/supabase/migration_layout_test.dart

      - name: Feature Unit Tests
        run: flutter test test/features/posts/

  media-worker:
    name: Media Worker Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media-worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: media-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Build
        run: npm run build
