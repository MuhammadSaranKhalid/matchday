include: package:flutter_lints/flutter.yaml
# OPT-IN UPGRADE: swap the include above for the stricter very_good_analysis
# ruleset (already in dev_dependencies; it's a plain include, NOT an analyzer
# plugin, so it's unaffected by the custom_lint conflict). Expect a wave of
# info-level lints on first switch — do it in a dedicated cleanup pass, not
# mid-feature, because pre-flight-qa requires `flutter analyze` to be clean.
# include: package:very_good_analysis/analysis_options.yaml

analyzer:
  # custom_lint plugin removed alongside riverpod_lint (see pubspec.yaml note).
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_locals: true
    avoid_print: true
    require_trailing_commas: true
    use_super_parameters: true
