name: matchday_widgetbook
description: Matchday Design System Component Catalog
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.7.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  widgetbook: ^3.19.0
  matchday:
    path: ..

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Inter Tight
      fonts:
        - asset: assets/fonts/InterTight.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
