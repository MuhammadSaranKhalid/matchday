services:
  api:
    build:
      context: .
      target: api
    init: true
    stop_grace_period: 15s
    environment: &app-environment
      NODE_ENV: production
      APP_NAME: matchday
      LOG_LEVEL: info
      TRUST_PROXY_HOPS: "1"
      CORS_ORIGINS: http://localhost:3000
      SWAGGER_ENABLED: "false"
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-require}
      REDIS_URL: redis://redis:6379
      REDIS_NAMESPACE: ${REDIS_NAMESPACE:-matchday}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      SUPABASE_AUTH_ISSUER: ${SUPABASE_AUTH_ISSUER}
      SUPABASE_AUTH_AUDIENCE: ${SUPABASE_AUTH_AUDIENCE:-authenticated}
      SUPABASE_AUTH_MODE: ${SUPABASE_AUTH_MODE:-jwks}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s

  worker:
    build:
      context: .
      target: worker
    init: true
    stop_grace_period: 15s
    environment: *app-environment
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:8.2-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
