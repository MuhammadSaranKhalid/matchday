services:
  api:
    environment: &smoke-environment
      DATABASE_URL: postgresql://postgres:matchday_test_password@postgres:5432/matchday_test
      DATABASE_SSL_MODE: disable
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: http://supabase.invalid
      SUPABASE_SECRET_KEY: smoke-secret-key
      SUPABASE_PUBLISHABLE_KEY: smoke-publishable-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    environment: *smoke-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: matchday_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: matchday_test_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d matchday_test"]
      interval: 1s
      timeout: 3s
      retries: 30
