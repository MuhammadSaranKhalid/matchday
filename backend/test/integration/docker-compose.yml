services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: matchday_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: matchday_test_password
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d matchday_test"]
      interval: 1s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
