<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Circk · Hi-fi prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body { background: #f0eee9; }
  /* Inside the canvas, our screens fill the iOS frame; we scope width here */
  .ck-host { width: 100%; height: 100%; display: flex; align-items: stretch; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>

<script type="text/babel" src="screens/TournamentSeed.jsx"></script>
<script type="text/babel" src="screens/TournamentAwards.jsx"></script>
<script type="text/babel" src="screens/TournamentRegister.jsx"></script>
<script type="text/babel" src="screens/MatchSheet.jsx"></script>
<script type="text/babel" src="screens/Scoring.jsx"></script>
<script type="text/babel" src="screens/Feed.jsx"></script>
<script type="text/babel" src="screens/Matches.jsx"></script>
<script type="text/babel" src="screens/Profile.jsx"></script>
<script type="text/babel" src="screens/Create.jsx"></script>
<script type="text/babel" src="screens/Setup.jsx"></script>
<script type="text/babel" src="screens/TeamCreate.jsx"></script>
<script type="text/babel" src="screens/TeamHub.jsx"></script>
<script type="text/babel" src="screens/TeamManage.jsx"></script>
<script type="text/babel" src="screens/Tournaments.jsx"></script>
<script type="text/babel" src="screens/Composer.jsx"></script>
<script type="text/babel" src="screens/PostFlow.jsx"></script>
<script type="text/babel" src="screens/Pavilion.jsx"></script>
<script type="text/babel" src="screens/MatchSetup.jsx"></script>
<script type="text/babel" src="screens/MatchRequest.jsx"></script>
<script type="text/babel" src="screens/RosterGate.jsx"></script>
<script type="text/babel" src="screens/MatchStart.jsx"></script>
<script type="text/babel" src="screens/CoScoring.jsx"></script>

<script type="text/babel" data-presets="react">
  // Wrap a screen with iOS frame
  function Phone({ children, dark = false }) {
    return (
      <div style={{
        width: 402, height: 874,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
      }}>
        <IOSDevice width={402} height={874} dark={dark}>
          {children}
        </IOSDevice>
      </div>
    );
  }

  // Cover artboard: title page for the canvas
  function Cover() {
    return (
      <div style={{
        width: 720, height: 874, padding: 56,
        background: 'oklch(0.985 0.008 85)',
        display: 'flex', flexDirection: 'column', justifyContent: 'space-between',
        fontFamily: 'Inter, sans-serif', color: 'oklch(0.18 0.02 80)',
        position: 'relative', overflow: 'hidden',
      }}>
        {/* tiny pitch markings background */}
        <svg width="560" height="560" viewBox="0 0 200 200" style={{ position: 'absolute', right: -120, bottom: -120, opacity: 0.05 }}>
          <ellipse cx="100" cy="100" rx="95" ry="60" stroke="oklch(0.18 0.02 80)" strokeWidth="0.4" fill="none"/>
          <ellipse cx="100" cy="100" rx="55" ry="34" stroke="oklch(0.18 0.02 80)" strokeWidth="0.4" fill="none"/>
          <rect x="92" y="70" width="16" height="60" stroke="oklch(0.18 0.02 80)" strokeWidth="0.4" fill="none"/>
          <line x1="100" y1="40" x2="100" y2="160" stroke="oklch(0.18 0.02 80)" strokeWidth="0.4"/>
        </svg>

        <div>
          <div style={{
            fontFamily: 'JetBrains Mono', fontSize: 11, fontWeight: 600,
            color: 'oklch(0.52 0.02 80)', letterSpacing: '0.12em', textTransform: 'uppercase',
          }}>
            v0.1 · hi-fi prototype · iOS
          </div>
          <div style={{
            fontFamily: 'Inter Tight', fontWeight: 700, letterSpacing: '-0.045em',
            fontSize: 140, lineHeight: 0.9, marginTop: 24,
          }}>
            circk<span style={{ color: 'oklch(0.62 0.19 28)' }}>.</span>
          </div>
          <div style={{ fontSize: 22, color: 'oklch(0.30 0.02 80)', maxWidth: 480, lineHeight: 1.3, marginTop: 24, fontWeight: 500 }}>
            Community cricket — for the<br/>club, the village, the mohalla.
          </div>
        </div>

        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 24, fontSize: 13, lineHeight: 1.5 }}>
          <div>
            <div style={{ fontFamily: 'JetBrains Mono', fontSize: 10, fontWeight: 600, color: 'oklch(0.52 0.02 80)', letterSpacing: '0.12em', textTransform: 'uppercase', marginBottom: 6 }}>
              In this canvas
            </div>
            <div>3 hero flows · iPhone · interactive</div>
            <div style={{ color: 'oklch(0.52 0.02 80)' }}>Onboarding · Match view · Scoring</div>
          </div>
          <div>
            <div style={{ fontFamily: 'JetBrains Mono', fontSize: 10, fontWeight: 600, color: 'oklch(0.52 0.02 80)', letterSpacing: '0.12em', textTransform: 'uppercase', marginBottom: 6 }}>
              System
            </div>
            <div>Inter Tight · Inter · JetBrains Mono</div>
            <div style={{ color: 'oklch(0.52 0.02 80)' }}>Warm paper · pitch red · field green</div>
          </div>
        </div>
      </div>
    );
  }

  // ── System swatch artboard ──────────────────────────────
  function System() {
    const Swatch = ({ name, value, fg = '#fff' }) => (
      <div style={{
        background: value, color: fg,
        padding: '14px 14px 12px', borderRadius: 10,
        fontFamily: 'JetBrains Mono', fontSize: 10, fontWeight: 600,
        height: 96, display: 'flex', flexDirection: 'column', justifyContent: 'flex-end',
      }}>
        <div style={{ opacity: 0.85, letterSpacing: '0.05em' }}>{name}</div>
        <div style={{ opacity: 0.7, fontSize: 9 }}>{value}</div>
      </div>
    );
    return (
      <div style={{
        width: 720, height: 874, padding: 40,
        background: 'oklch(0.985 0.008 85)',
        fontFamily: 'Inter, sans-serif', color: 'oklch(0.18 0.02 80)',
        display: 'flex', flexDirection: 'column', gap: 28,
      }}>
        <div>
          <div style={{ fontFamily: 'JetBrains Mono', fontSize: 11, fontWeight: 600, color: 'oklch(0.52 0.02 80)', letterSpacing: '0.12em', textTransform: 'uppercase' }}>System / 01</div>
          <h2 style={{ fontFamily: 'Inter Tight', fontSize: 42, fontWeight: 700, letterSpacing: '-0.03em', margin: '8px 0 0', lineHeight: 1 }}>
            A calm system,<br/>built for moments of action.
          </h2>
        </div>

        <div>
          <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'oklch(0.52 0.02 80)', marginBottom: 10 }}>Type pairing</div>
          <div style={{ display: 'flex', gap: 30, alignItems: 'baseline', flexWrap: 'wrap' }}>
            <div>
              <div style={{ fontFamily: 'Inter Tight', fontSize: 64, fontWeight: 700, letterSpacing: '-0.04em', lineHeight: 0.9 }}>132/4</div>
              <div style={{ fontSize: 11, fontFamily: 'JetBrains Mono', color: 'oklch(0.52 0.02 80)', marginTop: 6 }}>Inter Tight · display</div>
            </div>
            <div>
              <div style={{ fontFamily: 'Inter', fontSize: 18, fontWeight: 500, lineHeight: 1.3 }}>Lahore Lions need 46 from 33 balls</div>
              <div style={{ fontSize: 11, fontFamily: 'JetBrains Mono', color: 'oklch(0.52 0.02 80)', marginTop: 6 }}>Inter · body</div>
            </div>
            <div>
              <div style={{ fontFamily: 'JetBrains Mono', fontSize: 14 }}>14.3 ov · CRR 9.10</div>
              <div style={{ fontSize: 11, fontFamily: 'JetBrains Mono', color: 'oklch(0.52 0.02 80)', marginTop: 6 }}>JetBrains Mono · data</div>
            </div>
          </div>
        </div>

        <div>
          <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'oklch(0.52 0.02 80)', marginBottom: 10 }}>Palette</div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 8 }}>
            <Swatch name="ink" value="oklch(0.18 0.02 80)" />
            <Swatch name="paper" value="oklch(0.985 0.008 85)" fg="oklch(0.30 0.02 80)" />
            <Swatch name="pitch red" value="oklch(0.62 0.19 28)" />
            <Swatch name="field green" value="oklch(0.56 0.13 148)" />
            <Swatch name="cream" value="oklch(0.94 0.05 90)" fg="oklch(0.30 0.02 80)" />
            <Swatch name="muted" value="oklch(0.52 0.02 80)" />
            <Swatch name="line" value="oklch(0.90 0.008 85)" fg="oklch(0.30 0.02 80)" />
            <Swatch name="amber" value="oklch(0.78 0.14 80)" fg="oklch(0.30 0.02 80)" />
          </div>
        </div>

        <div>
          <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'oklch(0.52 0.02 80)', marginBottom: 10 }}>Ball pills</div>
          <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
            <span className="ck-ball dot">•</span>
            <span className="ck-ball">1</span>
            <span className="ck-ball">2</span>
            <span className="ck-ball four">4</span>
            <span className="ck-ball six">6</span>
            <span className="ck-ball wkt">W</span>
            <span className="ck-ball extra">wd</span>
            <span className="ck-ball extra">nb</span>
            <span style={{ marginLeft: 'auto', fontSize: 11, fontFamily: 'JetBrains Mono', color: 'oklch(0.52 0.02 80)' }}>
              the unit of cricket
            </span>
          </div>
        </div>

        <div style={{ flex: 1 }} />
        <div style={{ fontSize: 12, color: 'oklch(0.52 0.02 80)', lineHeight: 1.5 }}>
          The product is data-dense by nature — averages, rates, balls, overs.
          We lean on neutral paper tones so the score numbers can lead.
          Red for pitch / live / wickets; green for runs and pace.
          No green field clichés.
        </div>
      </div>
    );
  }

  function App() {
    return (
      <DesignCanvas>
        <DCSection id="overview" title="Circk" subtitle="Community cricket — hi-fi prototype">
          <DCArtboard id="cover" label="00 · Cover" width={720} height={874}>
            <Cover />
          </DCArtboard>
          <DCArtboard id="system" label="01 · Visual system" width={720} height={874}>
            <System />
          </DCArtboard>
        </DCSection>

        <DCSection id="signin" title="Sign-in" subtitle="The welcome screen — Email→OTP as the primary path, Continue with Google below.">
          <DCArtboard id="signin-a" label="Sign in" width={402} height={874}>
            <div className="ck-host"><IOSDevice width={402} height={874}><CkSignInA /></IOSDevice></div>
          </DCArtboard>
        </DCSection>

        <DCSection id="onboarding" title="Onboarding" subtitle="Phone OTP → profile → optional player profile · 5 steps in one device. Tap the dots/back to navigate.">
          <DCArtboard id="onb" label="02 · Onboarding flow (interactive)" width={402} height={874}>
            <div className="ck-host">
              <IOSDevice width={402} height={874}>
                <CkOnboarding />
              </IOSDevice>
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection id="tournament" title="Tournament" subtitle="League standings, fixtures, knockout bracket — Spring Cup '26 mid-tournament with one QF live. Tabs are clickable.">
          <DCArtboard id="tour" label="03 · Tournament — Spring Cup '26 (public)" width={402} height={874}>
            <div className="ck-host">
              <IOSDevice width={402} height={874}>
                <CkTournament />
              </IOSDevice>
            </div>
          </DCArtboard>
          <DCArtboard id="tour-manage" label="04 · Tournament — Organizer view (interactive)" width={402} height={874}>
            <div className="ck-host">
              <IOSDevice width={402} height={874}>
                <CkTournamentManage />
              </IOSDevice>
            </div>
          </DCArtboard>
          <DCArtboard id="tour-register" label="05 · Register team (captain, interactive)" width={402} height={874}>
            <div className="ck-host">
              <IOSDevice width={402} height={874}>
                <CkTournamentRegister />
              </IOSDevice>
            </div>
          </DCArtboard>
          <DCArtboard id="tour-seed" label="06 · Seed teams → Lock bracket (interactive)" width={402} height={874}>
            <div className="ck-host">
              <IOSDevice width={402} height={874}>
                <CkTournamentSeed />
              </IOSDevice>
            </div>
          </DCArtboard>
          <DCArtboard id="tour-sheet" label="07 · Match management sheet" width={402} height={874}>
            <div className="ck-host">
              <IOSDevice width={402} height={874}>
                <CkMatchSheet />
              </IOSDevice>
            </div>
          </DCArtboard>
          <DCArtboard id="tour-awards" label="08 · Awards — finalize" width={402} height={874}>
            <div className="ck-host">
              <IOSDevice width={402} height={874}>
                <CkTournamentAwards />
              </IOSDevice>
            </div>
          </DCArtboard>
          <DCArtboard id="tour-winner" label="09 · Winner moment" width={402} height={874}>
            <div className="ck-host">
              <IOSDevice width={402} height={874}>
                <CkTournamentWinner />
              </IOSDevice>
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection id="team" title="Team" subtitle="The complete create-team flow (6 steps + add-player sub-flows + success), then the public team page and the manager view. The first artboard runs the entire flow start-to-finish.">
          <DCArtboard id="team-create" label="10 · Create team — full interactive flow" width={402} height={874}>
            <div className="ck-host">
              <IOSDevice width={402} height={874}>
                <CkTeamCreate />
              </IOSDevice>
            </div>
          </DCArtboard>
          <DCArtboard id="team-create-1" label="10a · Step 1 — Basics" width={402} height={874}>
            <div className="ck-host">
              <IOSDevice width={402} height={874}>
                <CkTeamCreate initialStep={1} />
              </IOSDevice>
            </div>
          </DCArtboard>
          <DCArtboard id="team-create-2" label="10b · Step 2 — Identity & colors" width={402} height={874}>
            <div className="ck-host">
              <IOSDevice width={402} height={874}>
                <CkTeamCreate initialStep={2} />
              </IOSDevice>
            </div>
          </DCArtboard>
          <DCArtboard id="team-create-3" label="10c · Step 3 — Home & location" width={402} height={874}>
            <div className="ck-host">
              <IOSDevice width={402} height={874}>
                <CkTeamCreate initialStep={3} />
              </IOSDevice>
            </div>
          </DCArtboard>
          <DCArtboard id="team-create-4" label="10d · Step 4 — Crest" width={402} height={874}>
            <div className="ck-host">
              <IOSDevice width={402} height={874}>
                <CkTeamCreate initialStep={4} />
              </IOSDevice>
            </div>
          </DCArtboard>
          <DCArtboard id="team-create-5" label="10e · Step 5 — Review" width={402} height={874}>
            <div className="ck-host">
              <IOSDevice width={402} height={874}>
                <CkTeamCreate initialStep={5} />
              </IOSDevice>
            </div>
          </DCArtboard>
          <DCArtboard id="team-create-done" label="10f · Created → lands on team page" width={402} height={874}>
            <div className="ck-host">
              <IOSDevice width={402} height={874}>
                <CkTeamCreate initialStep="done" />
              </IOSDevice>
            </div>
          </DCArtboard>
          <DCArtboard id="team-hub" label="11 · Team page — Lahore Lions (public)" width={402} height={874}>
            <div className="ck-host">
              <IOSDevice width={402} height={874}>
                <CkTeamHub />
              </IOSDevice>
            </div>
          </DCArtboard>
          <DCArtboard id="team-manage" label="12 · Team manager view (interactive)" width={402} height={874}>
            <div className="ck-host">
              <IOSDevice width={402} height={874}>
                <CkTeamManage />
              </IOSDevice>
            </div>
          </DCArtboard>
          <DCArtboard id="team-manage-empty-roster" label="12a · Manager — Roster empty (just created)" width={402} height={874}>
            <div className="ck-host">
              <IOSDevice width={402} height={874}>
                <CkTeamManage justCreated initialTab="Roster" />
              </IOSDevice>
            </div>
          </DCArtboard>
          <DCArtboard id="team-manage-empty-requests" label="12b · Manager — Requests empty" width={402} height={874}>
            <div className="ck-host">
              <IOSDevice width={402} height={874}>
                <CkTeamManage justCreated initialTab="Requests" />
              </IOSDevice>
            </div>
          </DCArtboard>
          <DCArtboard id="team-manage-empty-members" label="12c · Manager — Members empty" width={402} height={874}>
            <div className="ck-host">
              <IOSDevice width={402} height={874}>
                <CkTeamManage justCreated initialTab="Members" />
              </IOSDevice>
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection id="match" title="Live match" subtitle="What spectators see · scoreboard, current batters & bowler, this-over balls, run-rate, recent wickets.">
          <DCArtboard id="live" label="04 · Live match — spectator" width={402} height={874}>
            <div className="ck-host">
              <IOSDevice width={402} height={874}>
                <CkLiveMatch />
              </IOSDevice>
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection id="scoring" title="Live scoring" subtitle="The scorer's input UI — built for one-handed taps in the field. Tap runs, wickets, extras. Last ball updates live. Undo rolls back.">
          <DCArtboard id="score" label="05 · Ball-by-ball scoring (fully interactive)" width={402} height={874}>
            <div className="ck-host">
              <IOSDevice width={402} height={874}>
                <CkScoring />
              </IOSDevice>
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection id="tournaments-tab" title="Tournaments tab (bottom-nav)" subtitle="Replaces Discover in the bottom nav. Three takes on the same brief: Following · Playing · Organizing · Browse · Near you, with format filters and a featured tournament. All scrollable.">
          <DCArtboard id="tt-a" label="14a · Sectioned feed (canonical)" width={402} height={874}>
            <div className="ck-host"><IOSDevice width={402} height={874}><CkTournaments variant="sectioned" /></IOSDevice></div>
          </DCArtboard>
          <DCArtboard id="tt-b" label="14b · Featured hero + sub-tabs + filters" width={402} height={874}>
            <div className="ck-host"><IOSDevice width={402} height={874}><CkTournaments variant="tabbed" /></IOSDevice></div>
          </DCArtboard>
          <DCArtboard id="tt-c" label="14c · Editorial / bracket-first" width={402} height={874}>
            <div className="ck-host"><IOSDevice width={402} height={874}><CkTournaments variant="editorial" /></IOSDevice></div>
          </DCArtboard>
        </DCSection>

        <DCSection id="matches" title="Matches tab" subtitle="Live, Upcoming and Recent. Live scoreboards moved out of the home feed and into a dedicated matches tab — the feed now shows only social posts, with a slim Live-now rail at top.">
          <DCArtboard id="matches-live" label="13a · Matches — Live" width={402} height={874}>
            <div className="ck-host"><IOSDevice width={402} height={874}><CkMatches /></IOSDevice></div>
          </DCArtboard>
          <DCArtboard id="matches-upcoming" label="13b · Matches — Upcoming" width={402} height={874}>
            <div className="ck-host"><IOSDevice width={402} height={874}><CkMatches initialSub="upcoming" /></IOSDevice></div>
          </DCArtboard>
          <DCArtboard id="matches-recent" label="13c · Matches — Recent" width={402} height={874}>
            <div className="ck-host"><IOSDevice width={402} height={874}><CkMatches initialSub="recent" /></IOSDevice></div>
          </DCArtboard>
        </DCSection>

        <DCSection id="feed" title="Home feed" subtitle="Social posts only — announcements, milestones, recruitment, photos, tournament updates. A slim Live-now rail at the top links into the Matches tab.">
          <DCArtboard id="feed" label="06 · Home feed — full interactive" width={402} height={874}>
            <div className="ck-host"><IOSDevice width={402} height={874}><CkFeed /></IOSDevice></div>
          </DCArtboard>
        </DCSection>

        <DCSection id="profile" title="Player profile" subtitle="Three angles on a single player: career stats with trophies; recent form with last-5 innings; or shot-chart wagon wheel for analysts.">
          <DCArtboard id="prof-a" label="07a · Career + trophies (canonical)" width={402} height={874}>
            <div className="ck-host"><IOSDevice width={402} height={874}><CkProfileA /></IOSDevice></div>
          </DCArtboard>
          <DCArtboard id="prof-b" label="07b · Recent form / last 5" width={402} height={874}>
            <div className="ck-host"><IOSDevice width={402} height={874}><CkProfileB /></IOSDevice></div>
          </DCArtboard>
          <DCArtboard id="prof-c" label="07c · Shot chart / wagon wheel" width={402} height={874}>
            <div className="ck-host"><IOSDevice width={402} height={874}><CkProfileC /></IOSDevice></div>
          </DCArtboard>
        </DCSection>

        <DCSection id="create" title="Create tournament" subtitle="One complete end-to-end flow: basics → format → teams → schedule → rules → prize/invites → review → publish. Every step interactive.">
          <DCArtboard id="create" label="08 · Create tournament — full interactive flow" width={402} height={874}>
            <div className="ck-host"><IOSDevice width={402} height={874}><CkCreate /></IOSDevice></div>
          </DCArtboard>
        </DCSection>

        <DCSection id="setup" title="Match setup" subtitle="Pre-match. Toss + opening pair (canonical), XI selection, or full conditions screen with weather/pitch/format.">
          <DCArtboard id="set-a" label="09a · Toss + opening pair (canonical)" width={402} height={874}>
            <div className="ck-host"><IOSDevice width={402} height={874}><CkSetupA /></IOSDevice></div>
          </DCArtboard>
