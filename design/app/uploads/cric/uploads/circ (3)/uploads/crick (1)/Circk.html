<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Circk · Interactive prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  html, body {
    margin: 0; padding: 0;
    background: #14110d;
    min-height: 100vh;
    font-family: 'Inter', -apple-system, sans-serif;
    color: oklch(0.92 0.01 80);
    -webkit-font-smoothing: antialiased;
  }
  #root {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    box-sizing: border-box;
  }
  .stage {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
  }
  .meta {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-start;
    max-width: 220px;
  }
  .meta .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    color: oklch(0.62 0.02 80);
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .meta h1 {
    font-family: 'Inter Tight', sans-serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.025em;
    color: oklch(0.96 0.012 85);
    margin: 0;
    line-height: 1.1;
  }
  .meta p {
    font-size: 12px;
    line-height: 1.55;
    color: oklch(0.72 0.012 80);
    margin: 0;
  }
  .meta .hint {
    margin-top: 6px;
    font-size: 11px;
    color: oklch(0.62 0.02 80);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.04em;
    line-height: 1.6;
  }
  .meta button {
    margin-top: 10px;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid oklch(0.32 0.012 80);
    background: oklch(0.18 0.012 80);
    color: oklch(0.92 0.012 80);
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.04em;
  }
  .meta button:hover { background: oklch(0.22 0.012 80); }

  @media (max-width: 760px) {
    .stage { flex-direction: column; gap: 20px; }
    .meta { max-width: none; align-items: center; text-align: center; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>

<script type="text/babel" src="screens/Onboarding.jsx"></script>
<script type="text/babel" src="screens/SuggestFollows.jsx"></script>
<script type="text/babel" src="screens/Feed.jsx"></script>
<script type="text/babel" src="screens/Discover.jsx"></script>
<script type="text/babel" src="screens/Notifications.jsx"></script>
<script type="text/babel" src="screens/Profile.jsx"></script>
<script type="text/babel" src="screens/LiveMatch.jsx"></script>
<script type="text/babel" src="screens/Tournament.jsx"></script>
<script type="text/babel" src="screens/TournamentManage.jsx"></script>
<script type="text/babel" src="screens/Team.jsx"></script>
<script type="text/babel" src="screens/Setup.jsx"></script>
<script type="text/babel" src="screens/Scoring.jsx"></script>
<script type="text/babel" src="screens/Scorecard.jsx"></script>
<script type="text/babel" src="screens/Result.jsx"></script>
<script type="text/babel" src="screens/Rankings.jsx"></script>
<script type="text/babel" src="screens/Settings.jsx"></script>
<script type="text/babel" src="screens/Create.jsx"></script>

<script type="text/babel" src="AppShell.jsx"></script>

<script type="text/babel" data-presets="react">
  function App() {
    const [restartKey, setRestartKey] = React.useState(0);
    return (
      <div className="stage">
        <IOSDevice width={402} height={874}>
          <window.CkAppShell key={restartKey} />
        </IOSDevice>
        <div className="meta">
          <span className="eyebrow">Circk · Prototype</span>
          <h1>Cricket, the way it's actually played.</h1>
          <p>17 screens, fully wired. Tap rows, scoreboards, notifications — the whole thing navigates like a real app.</p>
          <div className="hint">
            ▸ Bottom tabs switch sections<br/>
            ▸ Tap any card or row to drill in<br/>
            ▸ Arrow at top-left of detail screens goes back<br/>
            ▸ Center "+" opens the Create sheet
          </div>
          <button onClick={() => setRestartKey(k => k + 1)}>Restart prototype</button>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
