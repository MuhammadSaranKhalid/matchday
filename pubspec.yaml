name: novex_clean_arch
description: Flutter clean architecture reference with Riverpod 3.x + Supabase + offline support.
publish_to: "none"
version: 0.4.0+1

environment:
  sdk: ^3.7.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # State management & DI
  # Note: riverpod runtime is on 3.x; the annotation/generator packages
  # have their own 4.x line. This is the intended versioning split.
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Backend: Supabase
  supabase_flutter: ^2.12.4

  # Native Google sign-in (v7+ API)
  google_sign_in: ^7.2.0

  # Local database (offline support)
  # NOTE: pinned to the 2.31 line. drift_dev 2.32+ requires analyzer >=10, which
  # conflicts with the stable Riverpod codegen line (analyzer ^9) under Flutter
  # 3.41.x (meta 1.17.0 caps analyzer <10.0.2). 2.31 accepts analyzer 9.x.
  drift: ^2.31.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5

  # Connectivity awareness
  connectivity_plus: ^6.1.0

  # UUID v4 generation for offline-created rows
  uuid: ^4.5.1

  # Functional error handling
  fpdart: ^1.1.0

  # Immutable models + sealed states
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Routing
  go_router: ^16.2.0

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  intl: ^0.20.2
  timeago: ^3.7.1
  http: ^1.6.0
  geolocator: ^14.0.2
  image_picker: ^1.2.2
  image_cropper: ^12.2.1
  flutter_image_compress: ^2.4.0
  cached_network_image: ^3.4.1
  blurhash_dart: ^1.2.1
  image: ^4.8.0
  flutter_blurhash: ^0.9.1
  photo_view: ^0.15.0
  equatable: ^2.0.8
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^18.0.1
  share_plus: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.3
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  drift_dev: ">=2.31.0 <2.32.0"  # capped: 2.32+ needs analyzer >=10 (see note above)

  # Lint rules
  # NOTE: riverpod_lint + custom_lint are temporarily removed. Every stable
  # riverpod_lint (<=3.1.3) requires analyzer ^9, but drift_dev ^2.32.1 requires
  # analyzer >=10, and Flutter 3.41.x pins meta 1.17.0 (analyzer <10.0.2). These
  # constraints are mutually exclusive, so the two tools cannot coexist today.
  # Re-add riverpod_lint once a release supports analyzer >=10. See CLAUDE.md §4.
  flutter_lints: ^5.0.0

  # Testing
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

# matchday launcher icon (the Seam ball on warm paper). Sources rasterized
# from assets/brand/*.svg via rsvg-convert. Regenerate: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/brand/appicon_1024.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_background: "#FBFAF6"
  adaptive_icon_foreground: "assets/brand/appicon_fg_1024.png"

flutter:
  uses-material-design: true

  # Bundled variable fonts (offline-first: no runtime fetch from
  # fonts.gstatic.com). Each file is a variable font spanning Thin→Black,
  # so a single asset covers every fontWeight the app requests.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Inter Tight
      fonts:
        - asset: assets/fonts/InterTight.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
