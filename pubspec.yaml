name: novex_clean_arch
description: Flutter clean architecture reference with Riverpod 3.x + Supabase + offline support.
publish_to: "none"
version: 0.4.0+1

environment:
  sdk: ^3.7.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # State management & DI
  # Note: riverpod runtime is on 3.x; the annotation/generator packages
  # have their own 4.x line. This is the intended versioning split.
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Backend: Supabase
  supabase_flutter: ^2.12.4

  # Native Google sign-in (v7+ API)
  google_sign_in: ^7.2.0

  # Local database (offline support)
  drift: ^2.32.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5

  # Connectivity awareness
  connectivity_plus: ^6.1.0

  # UUID v4 generation for offline-created rows
  uuid: ^4.5.1

  # Functional error handling
  fpdart: ^1.1.0

  # Immutable models + sealed states
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Routing
  go_router: ^16.2.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.3
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  drift_dev: ^2.32.1

  # Lint rules
  riverpod_lint: ^3.1.3
  custom_lint: ^0.6.7
  flutter_lints: ^5.0.0

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
