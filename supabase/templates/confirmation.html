<!--
  MatchDay — email OTP (first-time email). THIS is the one that was broken.

  When "Confirm email" is on (prod: mailer_autoconfirm=false), GoTrue routes a
  signInWithOtp() for an unknown email through signup, which sends the
  CONFIRMATION template — not magic_link.html. Supabase's stock confirmation
  template carries only {{ .ConfirmationURL }}, so every first-time user got a
  link and no code, and the app's OTP screen could never be satisfied.

  Code-only, same as magic_link.html — see the note there for why the link is
  omitted. verifyOTP(type: OtpType.email) accepts this token: GoTrue's `email`
  type checks the confirmation token as well as the magic-link one, so the
  client needs no change.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#FBFAF6;margin:0;padding:32px 12px;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:440px;background-color:#FFFFFF;border:1px solid #E6E2D9;border-radius:14px;">
        <tr>
          <td style="padding:32px 32px 8px 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
            <div style="font-size:13px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#DC4D32;">MatchDay</div>
            <h1 style="margin:14px 0 0 0;font-size:21px;line-height:1.3;font-weight:700;color:#29251E;">Confirm your email</h1>
            <p style="margin:10px 0 0 0;font-size:15px;line-height:1.55;color:#4A4339;">Enter this code in the app to finish setting up your account.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:22px 32px 0 32px;">
            <div style="background-color:#FBFAF6;border:1px solid #E6E2D9;border-radius:12px;padding:20px 12px;text-align:center;font-family:'SFMono-Regular',Menlo,Consolas,'Courier New',monospace;font-size:34px;font-weight:700;letter-spacing:9px;color:#29251E;">{{ .Token }}</div>
          </td>
        </tr>
        <tr>
          <td style="padding:18px 32px 32px 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
            <p style="margin:0;font-size:13px;line-height:1.55;color:#8A8170;">This code expires in one hour and can be used once.</p>
            <p style="margin:8px 0 0 0;font-size:13px;line-height:1.55;color:#8A8170;">If you didn't request it, you can ignore this email &mdash; no account is created until the code is entered.</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
