<!--
  MatchDay — email OTP (existing user).

  GoTrue sends THIS template when signInWithOtp() is called for an email that
  already has an account. First-time emails get confirmation.html instead —
  keep the two in sync.

  Deliberately code-only: no {{ .ConfirmationURL }} link. The link and the code
  share one single-use token, so a mail scanner that prefetches the link (Outlook
  Safe Links, Gmail proxies, WhatsApp previews) consumes it, and the code the
  user then types comes back "Token has expired or is invalid". The app has no
  web surface to land the link on anyway — it is verifyOTP(type: email) only.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#FBFAF6;margin:0;padding:32px 12px;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:440px;background-color:#FFFFFF;border:1px solid #E6E2D9;border-radius:14px;">
        <tr>
          <td style="padding:32px 32px 8px 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
            <div style="font-size:13px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#DC4D32;">MatchDay</div>
            <h1 style="margin:14px 0 0 0;font-size:21px;line-height:1.3;font-weight:700;color:#29251E;">Your sign-in code</h1>
            <p style="margin:10px 0 0 0;font-size:15px;line-height:1.55;color:#4A4339;">Enter this code in the app to sign in.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:22px 32px 0 32px;">
            <div style="background-color:#FBFAF6;border:1px solid #E6E2D9;border-radius:12px;padding:20px 12px;text-align:center;font-family:'SFMono-Regular',Menlo,Consolas,'Courier New',monospace;font-size:34px;font-weight:700;letter-spacing:9px;color:#29251E;">{{ .Token }}</div>
          </td>
        </tr>
        <tr>
          <td style="padding:18px 32px 32px 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
            <p style="margin:0;font-size:13px;line-height:1.55;color:#8A8170;">This code expires in one hour and can be used once.</p>
            <p style="margin:8px 0 0 0;font-size:13px;line-height:1.55;color:#8A8170;">If you didn't request it, you can ignore this email &mdash; nobody can sign in without the code.</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
